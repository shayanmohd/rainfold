<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Bricolage"; src: url("fonts/bricolagegrotesque_semibold.ttf"); font-weight: 600; }
html, body { margin: 0; padding: 0; }
body { width: 1024px; height: 500px; overflow: hidden; position: relative; background: linear-gradient(135deg, #159EBC, #0E809E); font-family: "Bricolage", sans-serif; }
.mark { position: absolute; left: 40px; top: 84px; width: 270px; height: 360px; }
.copy { position: absolute; left: 318px; top: 168px; width: 340px; }
h1 { margin: 0; font-size: 82px; font-weight: 600; letter-spacing: -1.5px; line-height: 1; color: #FFFFFF; }
p { margin: 16px 0 0; font-size: 28px; line-height: 1.22; color: #FFFFFF; }
.shot { position: absolute; left: 700px; top: 56px; width: 280px; height: 460px; border-radius: 30px 30px 0 0; overflow: hidden; border: 8px solid #12323A; border-bottom: 0; box-shadow: 0 18px 40px rgba(13, 79, 94, 0.45); background: #E9F1F2; }
.shot img { display: block; width: 280px; margin-top: -40px; }
</style></head>
<body>
<svg class="mark" viewBox="24 16 60 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F7FA"/>
    </linearGradient>
    <clipPath id="drop">
      <path d="M54 22 C60.5 33.5 75 47 75 65 A21 21 0 0 1 33 65 C33 47 47.5 33.5 54 22 Z"/>
    </clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <path d="M55.5 25.5 C62 37 76.5 50.5 76.5 68.5 A21 21 0 0 1 34.5 68.5 C34.5 50.5 49 37 55.5 25.5 Z" fill="#0D4F5E" opacity="0.4" filter="url(#soft)"/>
  <g transform="translate(-2 0)"><g clip-path="url(#drop)">
    <rect x="26" y="18" width="56" height="25" fill="url(#sheen)"/>
    <rect x="26" y="43" width="56" height="3.6" fill="#12323A"/>
  </g></g>
  <g transform="translate(2 0)"><g clip-path="url(#drop)">
    <rect x="26" y="50.2" width="56" height="12" fill="url(#sheen)"/>
    <rect x="26" y="62.2" width="56" height="3.6" fill="#12323A"/>
  </g></g>
  <g clip-path="url(#drop)">
    <rect x="26" y="70" width="56" height="12.4" fill="url(#sheen)"/>
    <rect x="26" y="82.4" width="56" height="8" fill="#12323A"/>
  </g>
</svg>
<div class="copy"><h1>Rainfold</h1><p>Noise, fan and rain made live, all night</p></div>
<div class="shot"><img src="feature-shot.png" alt=""></div>
</body></html>
